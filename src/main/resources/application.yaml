spring:
  application:
    name: allygo-api

  config:
    import: optional:file:.env[.properties]

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      connect-timeout: 2s
      timeout: 2s

  flyway:
    enabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never

auth:
  token:
    issuer: ${JWT_ISSUER:allygo-api}
    secret-base64: ${JWT_SECRET_BASE64}
    access-token-ttl: 1h
    refresh-token-ttl: 14d
    verification-token-ttl: 10m
  password:
    bcrypt-strength: ${PASSWORD_BCRYPT_STRENGTH:12}
  profile-image:
    base-url: ${PROFILE_IMAGE_SIGNED_URL_BASE:https://storage.allygo.example/profile}
    signed-url-ttl: 5m
  verification:
    code-ttl: 3m
    resend-cooldown: 1m
    max-attempts: 5
    max-daily-sends: 5
    daily-limit-zone: ${AUTH_VERIFICATION_DAILY_LIMIT_ZONE:Asia/Seoul}
    code-pepper-base64: ${VERIFICATION_CODE_PEPPER_BASE64}
  rate-limit:
    login:
      window: 15m
      max-attempts: 5
      block-duration: 15m
    token-refresh:
      window: 1m
      max-attempts: 20
      block-duration: 5m

sms:
  provider: ${SMS_PROVIDER:solapi}
  base-url: ${SOLAPI_BASE_URL:https://api.solapi.com}
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender-number: ${SOLAPI_SENDER_NUMBER}
  connect-timeout: ${SMS_CONNECT_TIMEOUT:2s}
  read-timeout: ${SMS_READ_TIMEOUT:3s}
